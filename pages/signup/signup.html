<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - QuickServe</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="auth_container">

        <div class="auth_box">

            <h1>QuickServe</h1>
            <h2>Create Your Account</h2>
            <p class="subtitle">Join as a Customer or Service Provider</p>

            <form id="signupForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

                <label>I want to join as</label>
                <div class="role-selector">
                    <button type="button" class="role-option active" data-role="customer">Customer</button>
                    <button type="button" class="role-option" data-role="provider">Provider</button>
                </div>

                <button type="submit">Create Account</button>

            </form>

            <p class="switch_text">
                Already have an account?
                <a href="../login/login.html">Log In</a>
            </p>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="signup.js"></script>

</body>

</html>
